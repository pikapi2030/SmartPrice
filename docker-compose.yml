version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: price_comparison_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/comparison.db:/app/comparison.db
    environment:
      - SELENIUM_HEADLESS=True
      - MOCK_FALLBACK=True
      - CACHE_EXPIRY_SECONDS=3600
      - MATCHING_THRESHOLD=60.0
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: price_comparison_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: always
